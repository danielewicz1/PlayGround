<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iruna Quest</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#183b38;color:#fff}.game{position:relative;width:100%;height:100%;overflow:hidden;background:#69a65e}.world{position:absolute;width:2200px;height:1500px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;background-color:#73a85c;background-image:radial-gradient(circle at 15% 20%,rgba(57,125,62,.25) 0 110px,transparent 111px),radial-gradient(circle at 72% 65%,rgba(57,125,62,.18) 0 150px,transparent 151px),linear-gradient(35deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%)}
.world:after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(ellipse,#446d38 0 4px,transparent 5px);background-size:38px 31px;opacity:.38}.terrain{position:absolute;pointer-events:none}.path{width:650px;height:130px;border-radius:50%;background:#c7aa75;box-shadow:inset 0 0 20px #b19564}.path.a{left:720px;top:660px;transform:rotate(-18deg)}.path.b{left:1010px;top:760px;width:380px;transform:rotate(68deg)}.water{width:420px;height:580px;left:120px;top:580px;border-radius:48% 52% 60% 40%;background:#66aabc;box-shadow:inset 0 0 30px #477f8d}.bridge{width:180px;height:70px;left:335px;top:735px;background:#a66f3e;border:8px solid #74502f}.house{position:absolute;width:160px;height:125px;background:#f0d4a0;border:5px solid #6d4c32;box-shadow:0 12px 14px #2c5032}.house:before{content:'';position:absolute;left:-20px;top:-70px;width:190px;height:85px;background:#985236;clip-path:polygon(50% 0,100% 75%,88% 100%,12% 100%,0 75%)}.house:after{content:'';position:absolute;width:45px;height:60px;left:56px;bottom:-4px;background:#573a29}.h1{left:920px;top:390px}.h2{left:1180px;top:410px}.h3{left:1390px;top:610px}.tree{position:absolute;width:62px;height:62px;border-radius:50%;background:#3e7c43;box-shadow:-24px 18px 0 -10px #2f6638,24px 18px 0 -10px #315f35,0 -22px 0 -8px #579b4b,8px 8px 16px rgba(0,0,0,.24);z-index:3}.tree:after{content:'';position:absolute;width:14px;height:36px;left:24px;top:42px;background:#6b4b32}.rock{position:absolute;width:45px;height:28px;border-radius:50%;background:#89918a;box-shadow:inset -8px -5px #656e67}.flower{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff0a6;box-shadow:10px 6px #d7a7c8,-8px 12px #ffe68c,15px -8px #b9d9ff}
#entities{position:absolute;inset:0}.entity{position:absolute;z-index:20}.player{width:38px;height:54px}.shadow{position:absolute;width:42px;height:13px;border-radius:50%;background:rgba(28,43,30,.35);left:-2px;bottom:-4px}.chara{position:absolute;inset:0}.head{position:absolute;width:24px;height:24px;border-radius:50%;left:7px;top:3px;background:#efbc94;box-shadow:inset 0 5px #9c5b38}.body{position:absolute;width:31px;height:32px;left:4px;top:22px;border-radius:9px 9px 5px 5px;background:#e5d8ae;border-top:7px solid #a8d5dc}.legs{position:absolute;left:10px;bottom:-5px;width:7px;height:16px;background:#4d4e62;box-shadow:11px 0 #4d4e62}.player.walk .legs{animation:walk .28s infinite alternate}@keyframes walk{to{transform:rotate(16deg);box-shadow:-11px 0 #4d4e62}}.monster{width:48px;height:42px}.slime{width:44px;height:36px;border-radius:50% 50% 42% 42%;background:#82c968;border:3px solid #4d9b50;box-shadow:inset 7px 8px rgba(255,255,255,.22),0 7px 9px rgba(0,0,0,.2)}.slime:before,.slime:after{content:'';position:absolute;width:5px;height:7px;border-radius:50%;background:#26382c;top:13px}.slime:before{left:10px}.slime:after{right:10px}.wolf{width:46px;height:38px;border-radius:45% 55% 35% 35%;background:#c3aa82;border:3px solid #806b50}.wolf:before{content:'';position:absolute;left:-6px;top:-8px;width:25px;height:22px;background:#c3aa82;clip-path:polygon(0 0,40% 20%,65% 0,100% 35%,85% 100%,15% 100%)}.nameplate{position:absolute;left:50%;transform:translateX(-50%);top:-24px;font-size:10px;text-shadow:1px 1px #333;white-space:nowrap}.hpbar{position:absolute;width:40px;height:5px;left:4px;top:-12px;border:1px solid #244;background:#6e2b29}.hpbar i{display:block;height:100%;background:#75d563}.damage{position:absolute;color:#fff;font-weight:bold;text-shadow:-1px -1px #922,1px 1px #922;font-size:18px;animation:float .8s forwards}@keyframes float{to{transform:translateY(-45px);opacity:0}}
.ui{position:absolute;inset:0;pointer-events:none;z-index:100}.topbar{position:absolute;left:12px;top:10px;width:260px;height:78px;border:2px solid #b89558;border-radius:8px;background:linear-gradient(90deg,rgba(31,48,52,.94),rgba(31,48,52,.78));box-shadow:0 4px 12px #1f342c;pointer-events:auto}.portrait{position:absolute;width:62px;height:62px;left:7px;top:7px;border:2px solid #e1c58b;border-radius:50%;background:#87a0b8;overflow:hidden}.portrait:before{content:'';position:absolute;width:38px;height:38px;border-radius:50%;left:12px;top:-4px;background:#dcae87;box-shadow:0 31px 0 5px #e8dfb3}.level{position:absolute;left:75px;top:8px;font-size:13px;color:#ffe49b}.bar{position:absolute;left:75px;width:170px;height:11px;border:1px solid #26302d;border-radius:6px;background:#3c302f}.bar i{display:block;height:100%;border-radius:5px}.hp{top:31px}.hp i{background:linear-gradient(#f49382,#be4a42)}.mp{top:48px}.mp i{background:linear-gradient(#84aaf5,#476bd0)}.coin{position:absolute;left:75px;bottom:3px;font-size:13px;color:#ffe09a}.coin:before{content:'◆';color:#dcb750;margin-right:5px}.quest{position:absolute;right:12px;top:10px;width:220px;padding:10px 12px;border-radius:7px;border:2px solid #b89558;background:rgba(35,55,55,.91);font-size:13px;pointer-events:auto}.quest h3{margin:0 0 6px;font-size:14px;color:#f6d17c}.quest p{margin:3px 0}.bottomui{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.btn{width:58px;height:58px;border:2px solid #b99a62;border-radius:50%;background:radial-gradient(circle at 38% 32%,#72828a,#303d43);color:#fff;text-shadow:1px 1px #111;box-shadow:0 4px 8px rgba(0,0,0,.35);font-family:Georgia;font-size:14px;pointer-events:auto}.btn.attack{width:72px;height:72px;margin-top:-14px;background:radial-gradient(circle at 38% 32%,#c67a69,#7b3b32);font-size:18px}.btn:active,.action:active{filter:brightness(.7);transform:scale(.94)}.joystick{position:absolute;left:28px;bottom:25px;width:118px;height:118px;border:2px solid rgba(215,202,151,.55);border-radius:50%;background:rgba(45,71,64,.25);pointer-events:auto}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:33px;top:33px;background:rgba(230,220,178,.7);box-shadow:0 3px 8px rgba(0,0,0,.25)}.actions{position:absolute;right:12px;bottom:18px;display:flex;gap:8px;pointer-events:auto}.action{width:52px;height:52px;border:2px solid #b89558;border-radius:10px;background:rgba(47,68,68,.92);color:#ffe3a1;font-size:20px}.chat{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(420px,50%);height:26px;padding:4px 10px;border-radius:13px;background:rgba(24,43,44,.72);text-align:center;font-size:12px}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(410px,calc(100% - 30px));min-height:300px;padding:18px;border:3px solid #c4a56c;border-radius:10px;background:linear-gradient(135deg,#465e5a,#263d3d);box-shadow:0 12px 40px rgba(0,0,0,.55);pointer-events:auto;opacity:0;visibility:hidden;transition:.18s}.panel.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}.panel h2{margin:0 0 14px;text-align:center;color:#ffe0a0}.close{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;border:2px solid #b89558;background:#6e3f37}.inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{position:relative;height:74px;border:2px solid #9c8559;border-radius:7px;background:rgba(24,38,38,.65);display:flex;align-items:center;justify-content:center;font-size:30px}.slot span{position:absolute;right:5px;bottom:3px;font-size:11px}.shop-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:8px;border-bottom:1px solid #718076}.buy{border:1px solid #b89558;border-radius:5px;background:#80623b;color:#fff;padding:7px}.titlecard{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:300;text-align:center;text-shadow:0 3px 6px #1c3b30;pointer-events:none;animation:fadeTitle 3s forwards}@keyframes fadeTitle{0%,70%{opacity:1}100%{opacity:0}}.titlecard h1{font-size:38px;margin:0;color:#ffe7ae}.titlecard p{margin:6px;color:#dff1cb}@media(max-width:700px){.quest{width:180px;font-size:11px}.topbar{transform:scale(.82);transform-origin:left top}.joystick{left:10px;bottom:10px;transform:scale(.82);transform-origin:left bottom}.actions{right:7px;bottom:8px}.action{width:46px;height:46px}.chat{display:none}.bottomui{bottom:8px}.btn{width:50px;height:50px}.btn.attack{width:62px;height:62px}.titlecard h1{font-size:28px}}
</style></head><body><div class="game" id="game"><div class="world" id="world"><div class="terrain path a"></div><div class="terrain path b"></div><div class="terrain water"></div><div class="terrain bridge"></div><div class="house h1"></div><div class="house h2"></div><div class="house h3"></div><div id="entities"></div></div>
<div class="ui"><div class="topbar"><div class="portrait"></div><div class="level" id="level">Lv. 12 Adventurer</div><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div><div class="coin" id="coins">1,240</div></div><div class="quest"><h3>◆ Current Quest</h3><p id="qtitle">Slime Trouble</p><p id="qprogress">Defeat slimes: 0 / 5</p></div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="bottomui"><button class="btn" id="skill1">Slash</button><button class="btn attack" id="attack">ATK</button><button class="btn" id="skill2">Heal</button></div><div class="actions"><button class="action" id="bag">🎒</button><button class="action" id="shop">⚒</button><button class="action" id="map">◉</button></div><div class="chat" id="chat">The village waits beyond the old bridge...</div></div>
<div class="panel" id="inventory"><button class="close">×</button><h2>Inventory</h2><div class="inventory"><div class="slot">🗡️<span>x1</span></div><div class="slot">🧪<span id="pots">3</span></div><div class="slot">🍞<span>x8</span></div><div class="slot">💎<span>x2</span></div><div class="slot">🛡️<span>x1</span></div><div class="slot">👑<span>x0</span></div><div class="slot">📜<span>x1</span></div><div class="slot">⬜<span>-</span></div></div></div>
<div class="panel" id="shopPanel"><button class="close">×</button><h2>Village Shop</h2><div class="shop-row"><b>Red Potion</b><span>♥ 60 HP</span><button class="buy" data-buy="potion" data-cost="80">80 ◆</button></div><div class="shop-row"><b>Iron Sword</b><span>ATK +4</span><button class="buy" data-buy="sword" data-cost="350">350 ◆</button></div><div class="shop-row"><b>Traveler's Bread</b><span>Restores MP</span><button class="buy" data-buy="bread" data-cost="45">45 ◆</button></div></div><div class="titlecard"><h1>ELM VILLAGE</h1><p>Peaceful Plains • Lv. 10–15</p></div></div>
<script>
const world=document.getElementById('world'),entities=document.getElementById('entities'),game=document.getElementById('game');
const player={x:1100,y:820,hp:160,maxHp:160,mp:95,maxMp:95,coins:1240,atk:24,level:12,potions:3,kills:0,dir:'down'};
let playerEl,move={x:0,y:0},kills=0,auto=false,monsters=[];
function makeWorld(){for(let i=0;i<18;i++){let t=document.createElement('div');t.className='tree';t.style.left=(100+((i*211)%1900))+'px';t.style.top=(80+((i*147)%1300))+'px';world.appendChild(t)}for(let i=0;i<35;i++){let r=document.createElement('div');r.className=i%3?'rock':'flower';r.style.left=(80+((i*137)%2050))+'px';r.style.top=(100+((i*193)%1370))+'px';world.appendChild(r)}}makeWorld();
function createPlayer(){playerEl=document.createElement('div');playerEl.className='entity player';playerEl.innerHTML='<div class="shadow"></div><div class="chara"><div class="head"></div><div class="body"></div><div class="legs"></div></div>';entities.appendChild(playerEl)}createPlayer();
function addMonster(type,x,y){let m={type,x,y,hp:type=='slime'?55:85,maxHp:type=='slime'?55:85,respawn:0};let el=document.createElement('div');el.className='entity monster';el.dataset.type=type;el.innerHTML=type=='slime'?'<div class="slime"></div>':'<div class="wolf"></div>';el.innerHTML+='<div class="nameplate">'+(type=='slime'?'Green Slime':'Forest Wolf')+'</div><div class="hpbar"><i></i></div>';entities.appendChild(el);m.el=el;monsters.push(m)}
[[ 'slime',1280,720],['slime',1450,850],['slime',1550,680],['slime',680,820],['wolf',1680,970],['wolf',520,610],['slime',900,1000]].forEach(a=>addMonster(...a));
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;
function joyMove(e){let r=joy.getBoundingRect?joy.getBoundingRect():joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,x=p.clientX-r.left-r.width/2,y=p.clientY-r.top-r.height/2,d=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);x=Math.cos(a)*d;y=Math.sin(a)*d;stick.style.transform=`translate(${x}px,${y}px)`;move.x=x/38;move.y=y/38}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener('pointerup',()=>{joyId=null;stick.style.transform='';move={x:0,y:0}});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function loop(){let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let mx=move.x+kx,my=move.y+ky,l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}if(mx||my){player.x=clamp(player.x+mx*3.1,35,2165);player.y=clamp(player.y+my*3.1,45,1455);playerEl.classList.add('walk');if(mx!=0)player.dir=mx>0?'right':'left';if(my!=0)player.dir=my>0?'down':'up'}else playerEl.classList.remove('walk');render();requestAnimationFrame(loop)}
function render(){let camX=innerWidth/2-player.x,camY=innerHeight/2-player.y;world.style.transform=`translate(${camX-1100}px,${camY-750}px)`;playerEl.style.left=player.x+'px';playerEl.style.top=player.y+'px';monsters.forEach(m=>{if(!m.respawn){m.el.style.left=m.x+'px';m.el.style.top=m.y+'px';m.el.style.visibility='visible';let bar=m.el.querySelector('.hpbar i');bar.style.width=(m.hp/m.maxHp*100)+'%'}})}
function nearest(){let live=monsters.filter(m=>!m.respawn);live.sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));return live[0]}
function damageNumber(x,y,n){let d=document.createElement('div');d.className='damage';d.style.left=x+'px';d.style.top=y+'px';d.textContent=n;entities.appendChild(d);setTimeout(()=>d.remove(),800)}
function attack(){let m=nearest(),dist=m?Math.hypot(m.x-player.x,m.y-player.y):999;if(!m||dist>155){chat('No enemy is close enough!');return}let n=Math.floor(player.atk*(.8+Math.random*.5));m.hp-=n;damageNumber(m.x,m.y,n);chat('You strike the '+(m.type=='slime'?'slime':'wolf')+' for '+n+' damage!');if(m.hp<=0){m.respawn=1;m.el.style.visibility='hidden';player.coins+=m.type=='slime'?36:64;kills++;player.kills=kills;if(kills>=5)chat('Quest complete! Return to the village elder.');else chat(kills+' of 5 slimes defeated');updateUI();setTimeout(()=>{m.hp=m.maxHp;m.respawn=0;m.el.style.visibility='visible';render()},7000)}}
function chat(t){document.getElementById('chat').textContent=t}
function usePotion(){if(player.potions>0&&player.hp<player.maxHp){player.potions--;player.hp=Math.min(player.maxHp,player.hp+60);updateUI();chat('You used a Red Potion.') }else chat(player.hp>=player.maxHp?'Your HP is already full!':'No potions remaining!')}
function updateUI(){document.getElementById('hpbar').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('mpbar').style.width=(player.mp/player.maxMp*100)+'%';document.getElementById('coins').textContent=player.coins.toLocaleString();document.getElementById('pots').textContent=player.potions;document.getElementById('qprogress').textContent='Defeat slimes: '+Math.min(kills,5)+' / 5'}
document.getElementById('attack').onclick=attack;document.getElementById('skill1').onclick=attack;document.getElementById('skill2').onclick=usePotion;
function openPanel(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));document.getElementById(id).classList.add('open')}document.getElementById('bag').onclick=()=>openPanel('inventory');document.getElementById('shop').onclick=()=>openPanel('shopPanel');document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.parentElement.classList.remove('open'));document.getElementById('map').onclick=()=>chat('Elm Village — northern plains');
document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let cost=+b.dataset.cost;if(player.coins<cost){chat('Not enough coins!');return}player.coins-=cost;if(b.dataset.buy=='potion')player.potions++;if(b.dataset.buy=='sword')player.atk+=4;updateUI();chat('Purchase successful!')});
addEventListener('keydown',e=>{if(e.key===' ')attack();if(e.key.toLower=='e')usePotion()});updateUI();loop();
setInterval(()=>{if(player.hp<player.maxHp&&!document.hidden)player.hp=Math.min(player.maxHp,player.hp+1)},300);
</script></body></html>
